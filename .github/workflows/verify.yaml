name: Verify demo and production configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and lint debug APK
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug :app:lintDebug

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create isolated demo settings
        shell: pwsh
        run: ./deploy/init-demo.ps1
      - name: Build and exercise the API
        env:
          GATEWAY_PORT: '8180'
          CLASS_CALENDAR_CRON: '*/5 * * * * *'
          MUAYTHAI_TEST_URL: http://127.0.0.1:8180
          MUAYTHAI_TEST_CALENDAR: '1'
          MUAYTHAI_TEST_RECOVERY: '1'
          MUAYTHAI_TEST_COMPOSE_PROJECT: khang-acceptance
        run: |
          docker compose -p khang-acceptance -f deploy/compose.yaml up -d --build --wait --wait-timeout 180
          node tests/acceptance.mjs
      - name: Stop demo containers
        if: always()
        run: docker compose -p khang-acceptance -f deploy/compose.yaml down --volumes
      - name: Verify production-style database permissions
        shell: pwsh
        run: ./tests/production-smoke.ps1
