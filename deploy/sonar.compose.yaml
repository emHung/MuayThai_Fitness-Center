name: khang-sonar

services:
  sonarqube:
    image: ${SONAR_IMAGE:-sonarqube:community@sha256:65541accbdb92e27fe770fc6ba99988a3dd5a0c71ffafd67f88abfad366996fa}
    environment:
      # Local evaluation on Docker Desktop. Production hosts use the documented Elasticsearch prerequisites.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

  scanner:
    profiles: [scan]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN:
    volumes:
      - ..:/workspace
      - maven_cache:/root/.m2
    command:
      - mvn
      - -B
      - --no-transfer-progress
      - -f
      - backend/pom.xml
      - verify
      - org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
      - -Dsonar.projectKey=muaythai-fitness-backend
      - -Dsonar.projectName=MuayThai Fitness Backend

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  maven_cache:
