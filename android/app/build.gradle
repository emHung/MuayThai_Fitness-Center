plugins {
    id 'com.android.application' version '9.0.1'
}

def releaseUrl = providers.gradleProperty('authBaseUrl').orElse('').get()
def releaseSigning = [
    store: providers.environmentVariable('ANDROID_RELEASE_KEYSTORE').orNull,
    storePassword: providers.environmentVariable('ANDROID_RELEASE_STORE_PASSWORD').orNull,
    alias: providers.environmentVariable('ANDROID_RELEASE_KEY_ALIAS').orNull,
    keyPassword: providers.environmentVariable('ANDROID_RELEASE_KEY_PASSWORD').orNull
]
def buildConfigUrl = { url -> groovy.json.JsonOutput.toJson(url.endsWith('/') ? url : url + '/') }
def updateAsset = { fallback ->
    groovy.json.JsonOutput.toJson(providers.gradleProperty('appUpdateApkName').orElse(fallback).get())
}

android {
    namespace = 'vn.muaythai.app'
    compileSdk 36

    defaultConfig {
        applicationId 'vn.muaythai.app'
        minSdk 24
        targetSdk 36
        versionCode providers.gradleProperty('appVersionCode').orElse('7').get().toInteger()
        versionName providers.gradleProperty('appVersionName').orElse('0.1.6').get()
    }
    signingConfigs {
        release {
            if (releaseSigning.values().every { it }) {
                storeFile file(releaseSigning.store)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.alias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            def url = providers.gradleProperty('authBaseUrl').orElse('http://10.0.2.2:8080/').get()
            buildConfigField 'String', 'AUTH_BASE_URL', buildConfigUrl(url)
            def tailscale = java.net.URI.create(url).host?.endsWith('.ts.net')
            buildConfigField 'String', 'APP_UPDATE_APK_NAME',
                    updateAsset(tailscale ? 'app-debug-tailscale.apk' : 'app-debug.apk')
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField 'String', 'AUTH_BASE_URL', buildConfigUrl(releaseUrl)
            buildConfigField 'String', 'APP_UPDATE_APK_NAME', updateAsset('muaythai-release.apk')
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def validateRelease = tasks.register('validateProductionRelease') {
    doLast {
        def endpoint
        try {
            endpoint = new URI(releaseUrl)
        } catch (URISyntaxException ignored) {
            throw new GradleException('Set -PauthBaseUrl to a valid HTTPS gateway URL.')
        }
        if (endpoint.scheme != 'https' || !endpoint.host || endpoint.userInfo || endpoint.query || endpoint.fragment) {
            throw new GradleException('Set -PauthBaseUrl to a valid HTTPS gateway URL.')
        }
        if (!releaseSigning.values().every { it } || !file(releaseSigning.store).isFile()) {
            throw new GradleException('Set ANDROID_RELEASE_KEYSTORE, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS and ANDROID_RELEASE_KEY_PASSWORD.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn(validateRelease) }

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
}
