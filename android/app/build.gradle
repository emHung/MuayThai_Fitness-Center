plugins {
    id 'com.android.application' version '9.0.1'
}
android {
    namespace = 'vn.muaythai.app'
    compileSdk 36

    defaultConfig {
        applicationId 'vn.muaythai.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        def baseUrl = providers.gradleProperty('authBaseUrl').orElse('http://10.0.2.2:8080/').get()
        buildConfigField 'String', 'AUTH_BASE_URL', groovy.json.JsonOutput.toJson(baseUrl.endsWith('/') ? baseUrl : baseUrl + '/')
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
}
